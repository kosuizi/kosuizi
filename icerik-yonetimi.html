<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İçerik Yönetimi — KoşuİZİ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04101e;--bg2:#081929;--bg3:#0c2035;--line:#132d47;
  --text:#e8eaf0;--muted:#6b7280;--accent:#f97316;--accent2:#fb923c;--red:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:300;min-height:100vh}
#login-screen{
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4rem;
  min-height:100vh;padding:1.5rem;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(249,115,22,.06),transparent);
}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.08em}
.login-logo span{color:var(--accent)}
.login-subtitle{font-size:.8rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:-.8rem}
.login-box{display:flex;flex-direction:column;gap:.8rem;width:100%;max-width:280px;align-items:center}
.login-box input[type=password]{
  width:100%;padding:.7rem .9rem;text-align:center;
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font-size:.95rem;outline:none;font-family:inherit;
  transition:border-color .2s;
}
.login-box input:focus{border-color:var(--accent)}
.login-err{font-size:.78rem;color:var(--red);display:none;text-align:center}
.btn-login{
  width:100%;background:var(--accent);color:#111;border:none;border-radius:4px;
  padding:.7rem;font-size:.85rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
  font-family:inherit;transition:background .2s;
}
.btn-login:hover{background:var(--accent2)}
.login-hint{font-size:.72rem;color:var(--muted);text-align:center;max-width:280px;line-height:1.5}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">Koşu<span>İZİ</span></div>
  <div class="login-subtitle">İçerik Yönetimi</div>
  <div class="login-box">
    <input type="password" id="pass-input" placeholder="Şifre" autofocus autocomplete="current-password">
    <div class="login-err" id="login-err">Şifre hatalı. Tekrar deneyin.</div>
    <button class="btn-login" onclick="doLogin()">Giriş Yap</button>
  </div>
  <p class="login-hint">Giriş yaptığınızda doğrudan sitenin kendisine, düzenleme modunda yönlendirilirsiniz — site ile panel artık aynı sayfadır.</p>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyCvUecfTNPwTMki0_6ObUJjAOWcMzhASNM",
  authDomain:"kosuizi.firebaseapp.com",
  databaseURL:"https://kosuizi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"kosuizi",
  storageBucket:"kosuizi.firebasestorage.app",
  messagingSenderId:"",appId:""
};
const FB_EMAIL='goxelcelik@gmail.com';
const FB_PASSWORD='Kz#9mPw$vL2qR8!x';
const DEFAULT_PASS='kosuizi2025';

function loadScript(src){
  return new Promise((r,j)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=r; s.onerror=()=>j(new Error('Script yüklenemedi: '+src));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  try{ await firebase.auth().signInWithEmailAndPassword(FB_EMAIL,FB_PASSWORD); }catch(e){}
  return firebase.database();
}

async function doLogin(){
  const p=document.getElementById('pass-input').value.trim();
  const err=document.getElementById('login-err');
  err.style.display='none';
  err.textContent='Şifre hatalı. Tekrar deneyin.';
  try{
    const db=await ensureFirebase();
    const get=async key=>{ const s=await db.ref(key).get(); return s.exists()?s.val():null; };
    // Geçerli şifreler: 1) app_password (Koç Paneli şifresi; yoksa DEFAULT_PASS) — koç her zaman girebilir
    //                   2) content_password (İçerik Yönetimi'ne özel, varsa)
    const coachPass=(await get('app_password'))||DEFAULT_PASS;
    const contentPass=await get('content_password');
    const ok=(p===String(coachPass))||(contentPass && p===String(contentPass));
    if(!ok){ err.style.display='block'; return; }
  }catch(e){
    console.warn('Şifre doğrulanamadı:', e);
    err.textContent='Bağlantı hatası. Tekrar deneyin.';
    err.style.display='block'; return;
  }
  try{ localStorage.setItem('kosuizi_admin','1'); }catch(e){}
  location.href='index.html?edit=1';
}
document.getElementById('pass-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
